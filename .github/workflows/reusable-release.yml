# Note on Design:
# This is defined as a Reusable Workflow (workflow_call) in `.github/workflows/`
# rather than a Composite Action in `github-actions/` because GitHub Actions
# only allows environment protection rules (such as `environment: npm-publish` on
# the `publish` job, which enforces dual-approval and binds the `environment`
# OIDC claim for GCP Workload Identity Federation with OSS Exit Gate) to be
# defined at the job level. Centralizing this workflow here allows us to enforce
# the security gate for all calling repositories.

name: Reusable Publish Release

on:
  workflow_call:
    inputs:
      exit-gate-project:
        description: 'The OSS Exit Gate project name (overrides release.exitGate.projectName in .ng-dev/release.mjs).'
        required: false
        type: string
    secrets:
      angular-robot-key:
        description: 'The private key for the Angular Robot Github app'
        required: true

permissions: {}

jobs:
  # Job 1: Build and Verify the release assets.
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      is-release-commit: ${{ steps.check-commit.outputs.is-release }}
      dev-infra-ref: ${{ steps.get-ref.outputs.ref }}
    steps:
      # Step 1: Extract the ref of the running reusable workflow to use for checking out dev-infra actions.
      - name: Extract dev-infra ref
        id: get-ref
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # github.workflow_ref is of the form: "owner/repo/path/to/workflow.yml@ref"
          # Extract the ref (part after @)
          REF=$(echo "$WORKFLOW_REF" | cut -d'@' -f2)
          echo "ref=$REF" >> $GITHUB_OUTPUT

      # Checkout the calling repository first to ensure there is a .git directory at the root,
      # which prevents the subsequent local action's checkout from deleting the .dev-infra folder.
      - name: Checkout calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false

      # Checkout dev-infra dynamically at the same ref to get the custom actions.
      - name: Checkout dev-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: angular/dev-infra
          ref: ${{ steps.get-ref.outputs.ref }}
          path: .dev-infra
          clean: false
          persist-credentials: false

      # Initialize environment (using local checkout-and-setup-node).
      # We skip checkout because the calling repository was already checked out at the root.
      - name: Initialize environment
        uses: ./.dev-infra/github-actions/npm/checkout-and-setup-node
        with:
          skip-checkout: true

      # Step 4: Check if commit is a release commit
      - name: Check if commit is a release commit
        id: check-commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" =~ ^release:\ v[0-9] || "$COMMIT_MSG" =~ ^Bump\ version\ to\ \"v[0-9] ]]; then
            echo "is-release=true" >> $GITHUB_OUTPUT
          else
            echo "is-release=false" >> $GITHUB_OUTPUT
          fi

      # Step 5: Install node modules (conditional on release)
      - name: Install node modules
        if: steps.check-commit.outputs.is-release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Get version from package.json
        id: get-version
        if: steps.check-commit.outputs.is-release == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Step 6: Setup Bazel (using local bazel/setup)
      - name: Setup Bazel
        if: steps.check-commit.outputs.is-release == 'true'
        uses: ./.dev-infra/github-actions/bazel/setup

      - name: Build release packages
        if: steps.check-commit.outputs.is-release == 'true'
        run: pnpm ng-dev release build --json > built_packages.json

      - name: Run release prechecks
        if: steps.check-commit.outputs.is-release == 'true'
        run: pnpm ng-dev release precheck < built_packages.json

      - name: Pack release packages
        if: steps.check-commit.outputs.is-release == 'true'
        shell: bash
        run: |
          mkdir -p dist/packages-tgz
          while IFS= read -r path; do
            (cd "$path" && pnpm pack)
            mv "$path"/*.tgz dist/packages-tgz/
          done < <(jq -r '.[].outputPath' built_packages.json)

      - name: Archive built packages
        if: steps.check-commit.outputs.is-release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/packages-tgz/
          retention-days: 1

  # Job 2: Publish to NPM via OSS Exit Gate.
  # The `npm-publish` environment enforces Org-level protection rules (Dual Approval)
  # and binds the `environment` OIDC claim for GCP Workload Identity Federation.
  publish:
    name: Publish to NPM (OSS Exit Gate)
    needs: build
    if: needs.build.outputs.is-release-commit == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish # Enforces required reviewers, prevents self-approval, and binds OIDC environment claim
    permissions:
      contents: read
      id-token: write # Required for Google Cloud Workload Identity Federation (OSS Exit Gate)
    steps:
      # Checkout the calling repository first to ensure there is a .git directory at the root,
      # which prevents the subsequent local action's checkout from deleting the .dev-infra folder.
      - name: Checkout calling repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false

      # Checkout dev-infra dynamically at the same ref to get the custom actions.
      - name: Checkout dev-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: angular/dev-infra
          ref: ${{ needs.build.outputs.dev-infra-ref }}
          path: .dev-infra
          clean: false
          persist-credentials: false

      # Initialize environment (using local checkout-and-setup-node).
      # We skip checkout because the calling repository was already checked out at the root.
      - name: Initialize environment
        uses: ./.dev-infra/github-actions/npm/checkout-and-setup-node
        with:
          skip-checkout: true

      - name: Download built packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist/packages-dist/

      # Authenticate with GCP only after checkout, environment setup, and artifact download
      # so earlier steps do not run with live Workload Identity Federation credentials.
      - name: Authenticate with OSS Exit Gate GCP Project (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
          cleanup_credentials: true

      - name: Setup gcloud tool
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Run ng-dev CI publish (via custom action)
        uses: ./.dev-infra/github-actions/release/publish
        with:
          angular-robot-key: ${{ secrets.angular-robot-key }}
          exit-gate-project: ${{ inputs.exit-gate-project }}
          built-packages-dir: dist/packages-dist/
          expected-sha: ${{ github.sha }}
